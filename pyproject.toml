[project]
name = "melite-kimodo-nodes"
version = "0.1.0"
description = "Melite Kimodo (text-to-pose, multihmr2 + kimodo) — a Melite first-party ComfyUI extension pack"
# Version display + package identity for ComfyUI-Manager (it reads
# this for its version column). Dependencies live in BOTH files by
# one law: requirements.txt is what Manager pip-installs on the
# git-url door, [project].dependencies is what the Comfy registry
# action installs at publish — the estate's pack-parity wall pins
# the two doors read the same set (registry door, 2026-10-18).
license = {file = "LICENSE"}
dependencies = [
    "hydra-core>=1.3",
    "multihmr2 @ git+https://github.com/naver/multi-hmr2.git@f066532d096034700e5ba8b7b1ca655729d3ea6e",
    "trimesh",
    "xatlas",
    "kimodo @ git+https://github.com/nv-tlabs/kimodo.git@54257dd"
]

[project.urls]
Repository = "https://github.com/JayDataEngineer/melite-kimodo-nodes"

[tool.comfy]
PublisherId = "data-engineer"
DisplayName = "Melite Kimodo Nodes"
Icon = ""
